name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex.: v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Publicar como pré-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validar tag e versão
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Conferir se a versão do pacote corresponde à tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Informe a tag da versão (ex.: v1.0.0)."
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::A tag deve começar com 'v' (ex.: v1.0.0)."
            exit 1
          fi
          VERSION=$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("src/buscateses/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          print(match.group(1) if match else "")
          PY
          )
          if [ -z "$VERSION" ]; then
            echo "::error::Não foi possível ler __version__ em src/buscateses/__init__.py."
            exit 1
          fi
          EXPECTED="${TAG#v}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::A versão do pacote ($VERSION) não corresponde à tag $TAG (esperado: $EXPECTED)."
            exit 1
          fi
          echo "Versão $VERSION confirmada para a tag $TAG."

  build:
    name: Instalador (${{ matrix.os }} / ${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: x64
          - os: ubuntu-22.04
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-build.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r packaging/requirements-build.txt
      - name: Instalar Inno Setup 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $bases = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $iscc = $null
          foreach ($base in $bases) {
            foreach ($version in @("Inno Setup 6", "Inno Setup 7")) {
              $candidate = Join-Path $base "$version\ISCC.exe"
              if (Test-Path $candidate) { $iscc = $candidate; break }
            }
            if ($iscc) { break }
          }
          if (-not $iscc) { throw "ISCC.exe do Inno Setup não encontrado." }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Gerar instalador e rodar o teste de fumaça
        run: python packaging/build.py --skip-deps
      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: buscateses-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            packaging/output/*.dmg
            packaging/output/*.exe
            packaging/output/*.tar.gz
            packaging/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Criar tag e GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Baixar todos os instaladores
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Recalcular SHA256SUMS.txt consolidado
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Extrair notas do CHANGELOG
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          : > RELEASE_NOTES.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[?" ver "\\]?" { encontrado=1; next }
              encontrado && /^## / { exit }
              encontrado { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "BuscaTeses ${TAG}"
              echo
              echo "Instaladores para macOS (arm64 e x86_64), Windows x64 e Linux x86_64."
              echo "Cada arquivo está listado em SHA256SUMS.txt."
              echo
              echo "O aplicativo roda localmente, não tem telemetria e baixa o modelo e o"
              echo "catálogo na tela \"Primeiros passos\" da primeira execução. Depois disso,"
              echo "a internet só é usada para verificar atualizações (opcional) e, se você"
              echo "ativar, carregar o tradutor de Libras (VLibras), que vem desligado."
            } > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
      - name: Criar a tag e publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BuscaTeses ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
