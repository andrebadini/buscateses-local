version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      todas:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      todas:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      todas:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
