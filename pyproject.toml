[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buscateses-local"
dynamic = ["version"]
description = "Busca local e inteligente no Catálogo de Teses e Dissertações da CAPES"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "BuscaTeses contributors" }]
keywords = ["capes", "teses", "dissertacoes", "busca", "embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "platformdirs>=4,<5",
  "filelock>=3.12,<5",
  "huggingface_hub>=0.24,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<30",
  "onnxruntime>=1.18,<2",
  "tokenizers>=0.15,<1",
  "mcp>=1.23,<2",
  "pypdfium2>=4.30,<7",
  "charset-normalizer>=3,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1", "fpdf2>=2.7,<3"]
# Extra packages used by tools/dataset and by the tests that exercise it.
dataset = [
  "pyarrow>=15,<30",
  "duckdb>=1.0,<2",
  "tokenizers>=0.15,<1",
  "huggingface_hub>=0.24,<3",
  "numpy>=1.26,<3",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
]

[project.scripts]
buscateses = "buscateses.cli:main"

[project.urls]
Homepage = "https://github.com/andrebadini/buscateses-local"
Dataset = "https://huggingface.co/datasets/andrebadini/catalogo-teses-capes"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "buscateses.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["buscateses*"]

[tool.setuptools.package-data]
buscateses = ["web/*", "web/**/*", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "slow: downloads the real ONNX model / runs the 1M-vector benchmark",
]

[tool.coverage.run]
source = ["buscateses"]
